[package]
name = "cortex"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = [
    "json",
    "stream",
    "multipart",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio-cron-scheduler = "0.15"
toml = "1.1"
feed-rs = "2.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
futures = "0.3"
bytes = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
html2text = "0.16"
html2md = "0.2"
regex = "1.12"
sled = "0.34"
hound = "3.5"
chinese-lunisolar-calendar = "0.2"
strsim = "0.11"
sha2 = "0.11"
hex = "0.4"
axum = "0.8"
sysinfo = "0.38"
twox-hash = "2.1"
schemars = "1.2"

candle-core = { version = "0.10.2" }
candle-nn = { version = "0.10.2" }
candle-transformers = { version = "0.10.2" }
tts = { path = "../../tts" }

# Cross-platform home directory
dirs = "6.0"
tracing-subscriber = "0.3.23"

# Windows Service support (Windows only)
[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[features]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "tts/metal",
]

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"

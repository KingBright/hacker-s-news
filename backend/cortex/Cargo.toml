[package]
name = "cortex"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "multipart",
    "rustls-tls",
    "rustls-tls-native-roots",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tokio-cron-scheduler = "0.15"
toml = "0.9"
feed-rs = "2.3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
futures = "0.3"
bytes = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
html2text = "0.16"
html2md = "0.2"
regex = "1.10"
sled = "0.34"
hound = "3.5"
chinese-lunisolar-calendar = "0.2"
strsim = "0.11"
sha2 = "0.10"
hex = "0.4"
axum = "0.8"
sysinfo = "0.33"
twox-hash = "1.6"

candle-core = { version = "0.9.2" }
candle-nn = { version = "0.9.2" }
candle-transformers = { version = "0.9.2" }
tts = { path = "../../tts" }
qwen3-tts = { path = "../../../general/qwen3-tts-rs", features = ["hub"] }

# Cross-platform home directory
dirs = "5.0"

# Windows Service support (Windows only)
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[features]
metal = [
    "candle-core/metal",
    "candle-nn/metal",
    "candle-transformers/metal",
    "tts/metal",
    "qwen3-tts/metal",
]
